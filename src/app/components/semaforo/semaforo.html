<div class="contenedor-semaforos">
@for(i of [1,2,3,4,5];track i){

    <div class="cajita" >
        @if(contador()>=2){
            <div class="luz roja"></div>
        }@else{
            <div class="luz gris"></div>
        }

        @if(contador()==1){
            <div class="luz ambar"></div>
        }@else{
            <div class="luz gris"></div>
        }
        
        @if(contador()==0){
            <div class="luz verde"></div>
        }@else{
            <div class="luz gris"></div>
        }

    </div> 
}
</div>
<h1 [style.color]="colorin()">{{contador()}}</h1>

<button (click)="incrementar()">+1</button>
<button (click)="disminuir()">-1</button>
<button (click)="reset()">Reset</button>

@if(contador()>=0){
    <p style="color: green;">Los numeros son negativos</p>

}@else{
    <p style="color: red;">Los numeros son negativos</p>
}
